name: Bug report
description: Something renders wrong, advises wrong, or does not run
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Before anything else, please run:

        ```
        cct doctor
        ```

        It checks the wiring, the config and the render budget, and its output
        answers most of what we would otherwise have to ask you.

  - type: textarea
    id: doctor
    attributes:
      label: Output of `cct doctor`
      render: text
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        If it is a rendering problem, `cct status --demo all` output is ideal —
        it uses fixed data, so we see exactly what you see.
      placeholder: |
        1. …
        2. …
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal
      placeholder: WezTerm 20240203, Windows Terminal 1.19, iTerm2 3.5…
    validations:
      required: true

  - type: dropdown
    id: glyphs
    attributes:
      label: Glyph tier
      options: ['nerdfont', 'unicode', 'ascii', 'not sure']
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Your `cct.json`, if you have one
      render: json
    validations:
      required: false
