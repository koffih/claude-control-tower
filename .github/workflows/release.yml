name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and pack without publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Requires a repository environment named `npm` holding NPM_TOKEN. Gating on
    # an environment means a publish can require a human approval, which is worth
    # having on the one action in this repo that cannot be undone.
    environment: npm
    permissions:
      contents: write
      # Lets npm record a verifiable link between the published tarball and the
      # commit it was built from.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      # The tag is not trusted on its own: a green pipeline is a precondition for
      # publishing, so the full verification runs again here.
      - name: Verify
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Check the tag matches the package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
        if: github.event_name == 'push'

      - name: Inspect the tarball
        working-directory: packages/cli
        run: npm pack --dry-run

      # A tag can legitimately name a version that is already on the registry:
      # 0.1.0 was published by hand, before this workflow had credentials. npm
      # treats republishing an existing version as a hard error, so without this
      # check the pipeline would go red for a release that is in fact done.
      - name: Check whether the version is already on npm
        id: registry
        working-directory: packages/cli
        shell: bash
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # A version that is absent and a registry that is unreachable both exit
          # non-zero here, and both are answered the same way: attempt the
          # publish. npm is the authority on what exists, and it fails loudly —
          # which is what we want, rather than silently skipping a real release.
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on the registry; skipping the publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is not on the registry; publishing it."
          fi

      - name: Publish
        if: github.event_name == 'push' && steps.registry.outputs.published == 'false'
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
