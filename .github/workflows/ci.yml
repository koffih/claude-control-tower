name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the previous run irrelevant. Cancelling keeps queue
# times short for everyone else.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is a first-class target, not an afterthought: process spawning
        # and path handling behave differently enough there that a Linux-only
        # matrix would let real bugs through.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4
        with:
          # The git collector reads real repository state, so the test run needs
          # more than the default single-commit checkout.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke-test the built CLI
        shell: bash
        run: |
          node packages/cli/bin/cct.js --version
          node packages/cli/bin/cct.js plugins
          node packages/cli/bin/cct.js status --demo all
          # `doctor` exits non-zero when a check fails. Claude Code is not
          # installed on a runner, so a warning is expected and tolerated; a
          # hard failure is not.
          node packages/cli/bin/cct.js doctor || test $? -eq 1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Thresholds live in vitest.config.ts, so this step fails the build on a
      # coverage regression without any extra configuration here.
      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=moderate
